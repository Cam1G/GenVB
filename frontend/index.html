<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speak to Sing — OpenUTAU Voicebank</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="stage-wrap">
    <section id="stage" class="stage" data-state="idle" aria-live="polite">
      <div id="stage-content" class="stage-content"></div>
    </section>

    <div id="stage-foot" class="stage-foot">
      <label class="link-btn" id="upload-link">
        or upload a file
        <input type="file" id="file-upload" accept="audio/*" hidden />
      </label>
      <p id="stage-hint" class="hint hidden"></p>
    </div>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
